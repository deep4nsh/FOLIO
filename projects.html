<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | FlutterVerse Nexus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body class="bg-dark-900 text-gray-200">
    <portfolio-header></portfolio-header>
    
    <main>
        <!-- Projects Hero Section -->
        <section class="py-32 bg-gradient-to-br from-dark-800 to-dark-900">
            <div class="container mx-auto px-6 text-center">
                <h1 class="text-5xl md:text-7xl font-bold text-primary-400 mb-6 animate-fade-in-up">
                    My Projects
                </h1>
                <p class="text-xl md:text-2xl text-gray-300 mb-8 max-w-3xl mx-auto animate-fade-in delay-300">
                    Explore my portfolio of Flutter applications, each crafted with attention to detail and performance.
                </p>
            </div>
        </section>

        <!-- Projects Grid Section -->
        <section class="py-20 bg-dark-800">
            <div class="container mx-auto px-6">
                <div class="flex justify-between items-center mb-12">
                    <h2 class="text-3xl font-bold text-primary-400">All Projects</h2>
                    <div class="flex gap-4">
                        <button id="filter-all" class="filter-btn active bg-primary-600 text-white px-4 py-2 rounded-lg">
                            All
                        </button>
                        <button id="filter-flutter" class="filter-btn border border-primary-600 text-primary-400 px-4 py-2 rounded-lg">
                            Flutter
                        </button>
                        <button id="filter-firebase" class="filter-btn border border-primary-600 text-primary-400 px-4 py-2 rounded-lg">
                            Firebase
                        </button>
                    </div>
                </div>

                <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Projects will be loaded by JavaScript -->
                </div>

                <div class="mt-12 text-center">
                    <button id="load-more" class="bg-primary-600 text-white px-8 py-4 rounded-full font-semibold hover:bg-primary-500 transition-colors">
                        Load More Projects
                    </button>
                </div>
            </div>
        </section>

        <!-- Project Details Modal -->
        <div id="project-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-80 p-4">
            <div class="bg-dark-800 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                <div class="relative">
                    <button id="close-modal" class="absolute top-4 right-4 bg-dark-700 text-white p-2 rounded-full hover:bg-dark-600 transition-colors">
                        <i data-feather="x"></i>
                    </button>
                    <div id="modal-content" class="p-8">
                        <!-- Modal content will be loaded by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <portfolio-footer></portfolio-footer>

    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
        // Initialize projects page specific functionality
        document.addEventListener('DOMContentLoaded', function() {
            loadAllProjects();
            setupProjectFilters();
            setupProjectModal();
        });
    </script>
</body>
</html>
