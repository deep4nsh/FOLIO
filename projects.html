<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | FlutterVerse Nexus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-dark-900 dark:text-gray-200 transition-colors duration-300">
    <portfolio-header></portfolio-header>
    
    <main>
        <!-- Projects Hero Section -->
        <section class="py-32 bg-gradient-to-br from-slate-100 to-slate-200 dark:from-dark-800 dark:to-dark-900">
            <div class="container mx-auto px-6 text-center">
                <h1 class="text-5xl md:text-7xl font-bold text-primary-600 dark:text-primary-400 mb-6 animate-fade-in-up">
                    My Projects
                </h1>
                <p class="text-xl md:text-2xl text-slate-600 dark:text-gray-300 mb-8 max-w-3xl mx-auto animate-fade-in delay-300">
                    Explore my portfolio of Flutter applications, each crafted with attention to detail and performance.
                </p>
            </div>
        </section>

        <!-- Projects Grid Section -->
        <section class="py-20 bg-slate-50 dark:bg-dark-800 transition-colors duration-300 border-t border-slate-200 dark:border-gray-800">
            <div class="container mx-auto px-6">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-6 mb-12 border-b border-slate-200 dark:border-gray-700 pb-6">
                    <h2 class="text-3xl font-bold text-slate-800 dark:text-primary-400">All Projects</h2>
                    <div class="flex gap-4">
                        <button id="filter-all" class="filter-btn active bg-primary-600 text-white px-5 py-2.5 rounded-full font-semibold transition-all duration-300 shadow">
                            All
                        </button>
                        <button id="filter-flutter" class="filter-btn border-2 border-primary-600 text-primary-600 dark:text-primary-400 px-5 py-2.5 rounded-full font-semibold hover:bg-primary-600 hover:text-white transition-all duration-300">
                            Flutter
                        </button>
                        <button id="filter-firebase" class="filter-btn border-2 border-primary-600 text-primary-600 dark:text-primary-400 px-5 py-2.5 rounded-full font-semibold hover:bg-primary-600 hover:text-white transition-all duration-300">
                            Firebase
                        </button>
                    </div>
                </div>

                <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Projects will be loaded by JavaScript -->
                </div>
            </div>
        </section>

        <!-- Project Details Modal -->
        <div id="project-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-80 p-4 transition-all duration-300">
            <div class="bg-white dark:bg-dark-800 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto border border-slate-200 dark:border-gray-700 shadow-2xl relative animate-scale-in">
                <button id="close-modal" class="absolute top-4 right-4 bg-slate-100 dark:bg-dark-700 text-slate-800 dark:text-white p-2 rounded-full hover:bg-slate-200 dark:hover:bg-dark-600 transition-colors shadow z-10" aria-label="Close modal">
                    <i data-feather="x"></i>
                </button>
                <div id="modal-content" class="p-8 md:p-12">
                    <!-- Modal content will be loaded by JavaScript -->
                </div>
            </div>
        </div>
    </main>

    <portfolio-footer></portfolio-footer>

    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
        // Initialize projects page specific functionality
        document.addEventListener('DOMContentLoaded', function() {
            loadAllProjects();
            setupProjectFilters();
            setupProjectModal();
        });
    </script>
</body>
</html>
