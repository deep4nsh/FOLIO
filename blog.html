<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | FlutterVerse Insights</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        secondary: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            200: '#f5d0fe',
                            300: '#f0abfc',
                            400: '#e879f9',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                            800: '#86198f',
                            900: '#701a75',
                        },
                        dark: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-dark-900 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col justify-between">
    <portfolio-header></portfolio-header>
    
    <main class="flex-grow pt-24 pb-20">
        <!-- Blog List Section -->
        <section id="blog-list-section" class="py-12 bg-slate-50 dark:bg-dark-900 transition-colors duration-300">
            <div class="container mx-auto px-6">
                <!-- Hero Header -->
                <div class="text-center mb-16 max-w-2xl mx-auto">
                    <h1 class="text-4xl md:text-5xl font-bold text-primary-600 dark:text-primary-400 mb-4 animate-fade-in-up">
                        Technical Insights
                    </h1>
                    <p class="text-lg text-slate-600 dark:text-gray-400 animate-fade-in delay-200 leading-relaxed">
                        Deep dives into state management, performance tuning, and development architectures.
                    </p>
                </div>

                <!-- Search and Filters -->
                <div class="flex flex-col md:flex-row gap-6 justify-between items-center mb-12 border-b border-slate-200 dark:border-gray-800 pb-8">
                    <!-- Category Filters -->
                    <div class="flex flex-wrap gap-3 w-full md:w-auto">
                        <button id="filter-all" class="blog-filter-btn active bg-primary-600 text-white px-5 py-2.5 rounded-full font-semibold transition-all duration-300 shadow-sm hover:shadow">
                            All
                        </button>
                        <button id="filter-technical" class="blog-filter-btn border border-primary-600 text-primary-600 dark:text-primary-400 px-5 py-2.5 rounded-full font-semibold hover:bg-primary-600 hover:text-white dark:hover:text-white transition-all duration-300 shadow-sm">
                            Technical
                        </button>
                        <button id="filter-case-study" class="blog-filter-btn border border-primary-600 text-primary-600 dark:text-primary-400 px-5 py-2.5 rounded-full font-semibold hover:bg-primary-600 hover:text-white dark:hover:text-white transition-all duration-300 shadow-sm">
                            Case Study
                        </button>
                        <button id="filter-lessons" class="blog-filter-btn border border-primary-600 text-primary-600 dark:text-primary-400 px-5 py-2.5 rounded-full font-semibold hover:bg-primary-600 hover:text-white dark:hover:text-white transition-all duration-300 shadow-sm">
                            Lessons
                        </button>
                        <button id="filter-insights" class="blog-filter-btn border border-primary-600 text-primary-600 dark:text-primary-400 px-5 py-2.5 rounded-full font-semibold hover:bg-primary-600 hover:text-white dark:hover:text-white transition-all duration-300 shadow-sm">
                            Insights
                        </button>
                    </div>

                    <!-- Search Input -->
                    <div class="relative w-full md:w-80">
                        <input type="text" id="blog-search" placeholder="Search articles..." class="w-full bg-white dark:bg-dark-800 border border-slate-300 dark:border-gray-700 text-slate-800 dark:text-white rounded-full px-5 py-2.5 pl-12 focus:outline-none focus:border-primary-500 shadow-sm focus:ring-1 focus:ring-primary-500 transition-all">
                        <i data-feather="search" class="absolute left-4 top-3.5 text-slate-400 dark:text-gray-500 w-5 h-5"></i>
                    </div>
                </div>

                <!-- Articles Grid -->
                <div id="blog-posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Dynamic blog posts populated by JS -->
                </div>
            </div>
        </section>

        <!-- Blog Detail Section -->
        <section id="blog-detail-section" class="py-12 bg-slate-50 dark:bg-dark-900 transition-colors duration-300 hidden">
            <div class="container mx-auto px-6 max-w-4xl" id="blog-post-content">
                <!-- Dynamic blog detailed post populated by JS -->
            </div>
        </section>
    </main>

    <portfolio-footer></portfolio-footer>

    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
